[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are generated by Django: don't lint or reformat them
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors: basic style problems
    "F",    # Pyflakes: unused imports/variables, undefined names
    "I",    # isort: import order
    "B",    # flake8-bugbear: likely bugs
    "DJ",   # flake8-django: Django-specific mistakes
    "UP",   # pyupgrade: modern Python syntax
    "SIM",  # flake8-simplify: simpler equivalent code
]

[tool.ruff.lint.per-file-ignores]
# Django's generated boilerplate: keep it identical to what startproject creates
"manage.py" = ["F401", "B904"]
